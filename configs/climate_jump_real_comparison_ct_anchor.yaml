# configs/climate_jump_real_mexican_ct_anchor.yaml re-targeted at the comparison
# book: only `equity_marks.targets` / `target_peril_scales` differ (composed on
# the Mexican absolute scale by pipelines/10 --config
# configs/equity_mark_scales_comparison.yaml); everything else verbatim.

