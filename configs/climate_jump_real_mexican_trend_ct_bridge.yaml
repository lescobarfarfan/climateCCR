# Trajectory-lambda(t) rider on the MEXICAN BOOK headline leg — CT-BRIDGE
# growth (OQ-INT-12 a robustness; user ruling 2026-08-27: two riders, this is
# the central trend). Everything except `climate_jumps.intensity` transfers
# verbatim from configs/climate_jump_real_mexican.yaml (INT-20 headline).
#
#   lambda(t) = 19.2857 * exp(0.016793 * t),  t = Act/365 years from
#   valuation_date, held constant beyond t_clip = 4.46301 (= decimal 2031.0,
#   the NGFS window end + 1 — the MKT-NGFS-09 clip; np.interp end-clamp).
#
#   python pipelines/01_climate_jump_demo.py --config configs/climate_jump_real_mexican_trend_ct_bridge.yaml \
#       --book-config configs/mexican_book.yaml --data-root data/ccr_book_mx --horizonte largo
#
# growth = arrivals_growth_log_yr of the ciclon_tropical_2002_2024 pooled fit
# (+1.7%/yr, p = .09 on the EXTENSO-2024 base, HAZ-CENAPRED-13; was +1.4%/yr,
# p = .17 on the preliminary 2024 rows; results/hazard_jump_calibration_2000_2024/
# parameters.csv, pipelines/03) — the ONLY cross-regime-valid trend
# (HAZ-STOCH-06: ciclon tropical is the one series at event x state grain in
# both publication regimes; the bridge is statistically flat). RE-ANCHORED at
# the INT-20 headline level: lambda(0) = 19.2857.
#
# HAZ-STOCH-06 REGIME-BREAK CAVEAT (load-bearing): trend estimates across the
# 2016 publication break are censoring-confounded; this bridge growth is the
# honest cross-regime number and is not significantly different from zero —
# the rider bounds the trend sensitivity from below (its sibling
# _trend_registry bounds it from above). Values below are exact lambda(t) at
# the annual grid + the clip point (chord error of the engine's linear
# interpolation <= 0.1%); lambda(t_clip) = 20.7867 (x1.078) then holds.

seed: 233423        # master seed; jumps draw from a derived substream (GEN-07)
n_paths: 10000      # matches the locked baseline discipline (CCR-MIG-03)

valuation_date: "2026-07-17"   # Mexican calibration anchor (MKT-CURVE-05/CALIB-07)

horizons:
  largo:
    b3_grid: null
    max_step_days: null
  corto:
    b3_grid: ["0D", "1D", "1W", "2W", "1M", "2M", "3M", "6M", "9M", "1Y", "18M", "2Y", "3Y"]
    max_step_days: 1

climate_jumps:
  intensity: # lambda(t) trajectory (events/year), Act/365 years from valuation_date
    times_years: [0.0, 1.0, 2.0, 3.0, 4.0, 4.46301]
    values: [19.2857, 19.6123, 19.9444, 20.2822, 20.6257, 20.7867]
  rate_marks:
    median: 5.1658e-6 # sev_median 905.53 MDP-2025 / S_rate_eff_MX 175,293,784 -> +0.052 bp
    sigma: 1.2106     # transfers exactly from the registry lognormal severity fit
    sign: 1.0         # adverse event -> yields UP (decays through HW1F mean reversion)
    targets: [MXN_ZERO_YIELD_CURVE]
  equity_marks:
    median: 0.006864 # sev_median 905.53 MDP-2025 / K_eff 131,932 MDP-2025 -> -0.69% median
    sigma: 1.2106    # transfers exactly from the registry lognormal severity fit
    sign: -1.0
    targets:
      [HCITY_SHARE, HOTEL_SHARE, FIHO12_SHARE, RLH_SHARE, POSADAS_SHARE, FINN13_SHARE,
       ASUR_SHARE, GAP_SHARE, OMA_SHARE, VOLAR_SHARE, AGUA_SHARE, GRUMA_SHARE,
