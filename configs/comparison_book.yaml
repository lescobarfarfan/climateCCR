# Comparison ("control") counterparty book — INT-39 (the user ruling of 2026-10-12).
#
# Same builder, trade rules, desks and NAID count as configs/mexican_book.yaml,
# with the equity universe swapped for BMV issuers in sectors of LOW direct
# physical climate exposure (banks, telecom, media, consumer staples, pharma,
# retail, conglomerates, auto parts), disjoint from the Mexican climate book, so
# the climate jump band read on both books measures the HETEROGENEITY of the
# physical impact: the equity-channel sensitivities gamma are composed by the same
# INT-24/25 rule and anchored on the Mexican book's absolute scale
# (pipelines/10 --config configs/equity_mark_scales_comparison.yaml), so this
# book's sum w*gamma is a model output, not 1; the rate channel is common to
# both books (the solo_tasas decomposition row of pipelines/26).
#
#   1. pipelines/09_build_mexican_book.py --config configs/comparison_book.yaml
#      -> data/ccr_book_cmp/ (+ build_report.csv: which tickers survived)
#   2. pipelines/01_climate_jump_demo.py --config configs/climate_jump_real_comparison*.yaml
#      --book-config configs/comparison_book.yaml --data-root data/ccr_book_cmp
#
# The control claim is "lower sum w*gamma", never "zero": six fillers needed for
# 26-name parity carry real exposure under honest S rows (quimica, carreteras,
# parques industriales x2, agave/sequia) and are flagged
# `climate: filler_*`; banks' credit-channel exposure to climate is deliberately
# outside the physical mark (that is the hypothesis being tested). Bond rows are
# REPRESENTATIVE issuance terms by credit tier [eng] (the INT-21 route; verify
# opportunistically per OQ-INT-10). Universe researched 2026-10-12 against the
# 2024 S&P/BMV IPC roster; Yahoo availability and the min-data rule arbitrate at
# build time (dead/thin tickers are dropped and logged, the BACHOCO precedent;
# 2026-10-12: ALFAA / GMXT / SITESB-1 have no Yahoo listing -> replaced by
# ACTINVRB, FINDEP (financials) and FMTY14 (real-estate filler)).

# --- typed Config fields (infra.Config) ---
seed: 233423                 # matches the PIMPA golden baseline discipline
n_paths: 10000
settlement_currency: MXN
date_format: "%Y-%m-%d"

# --- book build parameters (consumed by pipelines/09 only) ---

valuation_date: "2026-07-17"   # the MKT calibration anchor (curve + IPC S0 date)
book_root: data/ccr_book_cmp   # output data-root, relative to the repo root

fetch:
  start: "2001-01-01"          # Yahoo history window start (max available)
  cache_subdir: data/market_mx/yahoo/book_cmp   # own raw pulls + _procedencia.json (GEN-02/05)

min_data:
  min_years: 3.0               # >= 3y of usable history before the valuation date
  max_gap_frac: 0.10           # <= 10% missing vs the panel's trading calendar

crisis_windows:
  gfc: ["2008-09-01", "2009-06-30"]
  peso_shock: ["2016-11-01", "2017-03-31"]
  covid: ["2020-03-01", "2021-06-30"]

inputs:
  hw1f_direct_input: results/market_calibration/direct_input/RFE_HW1F_Calibration_MX.csv
  sie_fix: data/market_mx/sie/fix.csv
  sie_tiies: data/market_mx/sie/tiies.csv
  scale_csv: results/loss_to_rate_scale_2000_2024/scale.csv  # INT-18/19 adopted beta

# Book-independent (alpha-driven) values; a separate dir keeps the Mexican
# artifact byte-identical.
rate_scale_output_dir: results/loss_to_rate_scale_cmp

# --- equity universe (26 names; tickers verbatim, INT-07) ---
# sector = the S-tier row in configs/equity_mark_scales.yaml; climate = tag.
equities:
  - {ticker: GFNORTEO.MX,   rf: GFNORTE_SHARE,  issuer: GRUPO_FINANCIERO_BANORTE, sector: bancos,          climate: low_direct_exposure}
  - {ticker: GENTERA.MX,    rf: GENTERA_SHARE,  issuer: GENTERA,                  sector: bancos,          climate: low_direct_exposure}
  - {ticker: BBAJIOO.MX,    rf: BBAJIO_SHARE,   issuer: BANCO_DEL_BAJIO,          sector: bancos,          climate: low_direct_exposure}
  - {ticker: RA.MX,         rf: REGIONAL_SHARE, issuer: REGIONAL,                 sector: bancos,          climate: low_direct_exposure}
  - {ticker: GFINBURO.MX,   rf: GFINBUR_SHARE,  issuer: GRUPO_FINANCIERO_INBURSA, sector: bancos,          climate: low_direct_exposure}
  - {ticker: BOLSAA.MX,     rf: BOLSA_SHARE,    issuer: BOLSA_MEXICANA_DE_VALORES, sector: bolsa,          climate: low_direct_exposure}
  - {ticker: AMXB.MX,       rf: AMX_SHARE,      issuer: AMERICA_MOVIL,            sector: telecom,         climate: low_direct_exposure}
  - {ticker: MEGACPO.MX,    rf: MEGA_SHARE,     issuer: MEGACABLE,                sector: telecom,         climate: low_direct_exposure}
  - {ticker: AXTELCPO.MX,   rf: AXTEL_SHARE,    issuer: AXTEL,                    sector: telecom,         climate: low_direct_exposure}
  - {ticker: TLEVISACPO.MX, rf: TLEVISA_SHARE,  issuer: GRUPO_TELEVISA,           sector: medios,          climate: low_direct_exposure}
  - {ticker: BIMBOA.MX,     rf: BIMBO_SHARE,    issuer: GRUPO_BIMBO,              sector: consumo_basico,  climate: low_direct_exposure}
  - {ticker: KIMBERA.MX,    rf: KIMBER_SHARE,   issuer: KIMBERLY_CLARK_MEXICO,    sector: consumo_basico,  climate: low_direct_exposure}
  - {ticker: LABB.MX,       rf: LAB_SHARE,      issuer: GENOMMA_LAB,              sector: farma,           climate: low_direct_exposure}
  - {ticker: LIVEPOLC-1.MX, rf: LIVEPOL_SHARE,  issuer: EL_PUERTO_DE_LIVERPOOL,   sector: comercio,        climate: low_direct_exposure}
  - {ticker: CHDRAUIB.MX,   rf: CHDRAUI_SHARE,  issuer: GRUPO_COMERCIAL_CHEDRAUI, sector: comercio,        climate: low_direct_exposure}
  - {ticker: LACOMERUBC.MX, rf: LACOMER_SHARE,  issuer: LA_COMER,                 sector: comercio,        climate: low_direct_exposure}
  - {ticker: SORIANAB.MX,   rf: SORIANA_SHARE,  issuer: ORGANIZACION_SORIANA,     sector: comercio,        climate: low_direct_exposure}
  - {ticker: GCARSOA1.MX,   rf: GCARSO_SHARE,   issuer: GRUPO_CARSO,              sector: conglomerado,    climate: low_direct_exposure}
  - {ticker: ACTINVRB.MX,   rf: ACTINVR_SHARE,  issuer: ACTINVER,                 sector: bancos,          climate: low_direct_exposure}
  - {ticker: NEMAKA.MX,     rf: NEMAK_SHARE,    issuer: NEMAK,                    sector: autopartes,      climate: low_direct_exposure}
  # Fillers for 26-name parity — moderate exposure under honest S rows, flagged.
  - {ticker: ORBIA.MX,      rf: ORBIA_SHARE,    issuer: ORBIA,                    sector: quimica,         climate: filler_water_intensive}
  - {ticker: PINFRA.MX,     rf: PINFRA_SHARE,   issuer: PINFRA,                   sector: infraestructura_carretera, climate: filler_fixed_infra}
  - {ticker: VESTA.MX,      rf: VESTA_SHARE,    issuer: VESTA,                    sector: inmobiliario_industrial,   climate: filler_fixed_assets}
  - {ticker: FINDEP.MX,     rf: FINDEP_SHARE,   issuer: FINANCIERA_INDEPENDENCIA, sector: bancos,          climate: low_direct_exposure}
  - {ticker: CUERVO.MX,     rf: CUERVO_SHARE,   issuer: BECLE,                    sector: bebidas_alcohol, climate: filler_agave_drought}
  - {ticker: FMTY14.MX,     rf: FMTY_SHARE,     issuer: FIBRA_MONTERREY,          sector: inmobiliario_industrial,   climate: filler_fixed_assets}

fx:
  rf: MXN_USD_FX_RATE          # required by the engine's settlement conversion
  source: sie_fix              # FIX is MXN per USD — the engine's CCY_USD convention

curve:
  rf: MXN_ZERO_YIELD_CURVE

# --- deterministic trade-generation rules (builder) — verbatim mexican_book.yaml ---
trade_rules:
  options:                     # per surviving listed issuer, on its own share
    target_position_mxn: 50000 # notional (contract multiplier) = target / S0
    legs:
      - {type: call, long_short: long,  moneyness: 1.00, tenor_years: 2}
      - {type: put,  long_short: short, moneyness: 0.95, tenor_years: 2}
  irs:                         # one spot-starting quarterly TIIE swap per issuer
    notional_mxn: 100000
    settlement_lag_days: 2
    fixed_rate_by_tenor: {5: 0.0875, 7: 0.0900, 10: 0.0940}  # near-par vs the 2026-07-17 curve [eng]
    tenor_cycle: [5, 7, 10]
    direction_cycle: [receiver, payer]
  bonds:
    default_face: 100000

