      Baja California Sur: 8694.2 # Los Cabos 7,488.2 + La Paz 1,206.0
      Guanajuato: 3169.0         # Bajío/León
      Sonora: 2156.9             # Hermosillo
      Michoacán: 1304.6          # Morelia
      Aguascalientes: 961.8
      Sinaloa: 585.2             # Los Mochis
      Colima: 218.4              # Manzanillo
