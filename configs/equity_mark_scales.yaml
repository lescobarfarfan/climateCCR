# Per-name state asset exposure (G). Hand-collected from public disclosures —
# provenance per block; [eng] representative-terms discipline (the OQ-INT-10
# cebures precedent). `estados` carries RAW magnitudes (passengers, property
# counts) — the pipeline normalizes; optional `resto_nacional` is a magnitude
# spread over population shares (for "top states named, rest aggregate"
# disclosures). Names without a block use population shares (the national-proxy
# tier, [Bressan2024] coarse fallback): HCITY (152 hotels / 75 cities,
# dispersed business portfolio), FIHO12 (87 hotels / 26 states, no public state
# table), FUNO, and all non-hotel/airport names. Industrials
# (CEMEX/GCC/GMEXICO/PENOLES/GRUMA/HERDEZ) are a deferred later-session
# extension (OQ-INT-11 residual) — config-only edits.
exposicion_geografica:
  ASUR_SHARE:
    method: pasajeros_2024
    fuente: "https://www.asur.com.mx/trafico-de-pasajeros-2 via https://www.elsureste.com.mx/trafico-aereo-disminuye-en-aeropuertos-operados-por-asur-durante-2024/"
    nota: "2024 terminal passengers, Mexican airports only (San Juan PR + Colombia excluded).
      Villahermosa = residual vs the published Mexico total 41,420,330 [eng]. Cancún+Cozumel
      -> Quintana Roo 75.1%."
    estados:            # passengers 2024
      Quintana Roo: 31124478     # Cancún 30,411,520 + Cozumel 712,958
      Yucatán: 3699877           # Mérida
      Oaxaca: 2634606            # Oaxaca 1,787,428 + Huatulco 847,178
      Veracruz: 1865366          # Veracruz 1,712,821 + Minatitlán 152,545
      Tabasco: 1481067           # Villahermosa (residual)
      Chiapas: 614936            # Tapachula
  GAP_SHARE:
    method: pasajeros_2024
    fuente: "https://www.globenewswire.com/news-release/2025/01/06/3005044/0/en/Grupo-Aeroportuario-del-Pacifico-Reports-in-December-2024-a-Passenger-Traffic-Increase-of-2-9-Compared-to-2023.html"
    nota: "Accumulated Jan-Dec 2024 terminal passengers (thousands), Mexican airports only
