# Sector-differentiated equity mark scales — the OQ-INT-11 distribution rule.
#
# Derives per-name relative sensitivities gamma_i for the 26 Mexican book
# equities (configs/mexican_book.yaml), redistributing the INT-17 book-level
# mark (median L/K_eff) across names WITHOUT re-estimating it:
#
#   gamma_raw_i = sum_s sum_p  G[i,s] * S[sector_i, p] * D[s,p] / pob[s]
#   gamma_i     = gamma_raw_i / sum_j w_j gamma_raw_j        (sum_j w_j = 1)
#
# - G[i,s]  per-name state asset shares (exposicion_geografica below; names
#   without a block fall back to population shares — the national-proxy tier,
#   [Bressan2024]'s HQ/coarse-proxy fallback, documented to UNDERSTATE
#   concentrated exposure).
# - S[sector,p] sector x peril-group susceptibility in [0,1] (tiers below).
# - D[s,p]  cumulative CENAPRED climate-scope damage 2000-2024, deflated to
#   MDP-2025 with configs/inpc_anual.yaml (same source + deflator discipline as
#   the INT-17/INT-20 calibration — measurement-consistent).
# - pob[s]  INEGI Censo 2020 state population — converts absolute state damage
#   into per-unit-exposure intensity (a small state hit often, e.g. BCS, is
#   more hazardous PER ASSET than a large state with equal total damage).
# - w_j     book equity MXN exposure (EQ-desk notional x ATM strike,
#   data/ccr_book_mx) — the renormalization makes the book-notional-weighted
#   mean gamma exactly 1, preserving the INT-17 anchor by construction.
#
# Consumed by pipelines/10_equity_mark_scales.py, which emits the
# `target_scales:` block pasted into configs/climate_jump_real_mexican*.yaml.
# Evidence table for the S ordering (CNSF hidro USO x TIPO DE EVENTO paid-loss
# shares) is written to results/equity_mark_scales/ by the same pipeline.

cenapred_panel: data/hazard_mx/datos_CENAPRED/consolidados_2000_2024/impacto_estado_anio_peril.csv
deflator: configs/inpc_anual.yaml
book_config: configs/mexican_book.yaml
eq_desk: data/ccr_book_mx/portfolio_data/desks/EQ/EQ_EUROPEAN_OPTIONS.csv
cnsf_hidro_siniestros: data/hazard_mx/datos_CNSF/consolidados/riesgos_hidrometereologicos/siniestros.csv.gz

window: {start_year: 2000, end_year: 2024}   # full panel: D is a climatology, not a rate fit,
                                             # so the 2016 regime break (HAZ-CENAPRED-10) only
                                             # shifts grain, not the state x peril damage mix.

# CENAPRED peril_canonico -> peril group (climate scope only, GEN-12; groups keep
# the S matrix at 6 columns; 'otros' pools perils totalling ~2% of damage).
peril_groups:
  ciclon_tropical: ["Ciclón tropical"]
  lluvia: ["Daños por lluvia"]
  inundacion: ["Inundación", "Marejada"]
  sequia: ["Sequía"]
  incendio_forestal: ["Incendio forestal"]
  otros: ["Deslizamiento", "Baja temperatura", "Tormenta severa", "Vientos/Tornado", "Tormenta eléctrica"]

# Susceptibility tiers (ordinal, [0,1]): alta 1.0 / media-alta 0.7 / media 0.4 /
# baja 0.2 / minima 0.1 / nula 0.0. Hybrid basis per OQ-INT-11 decision:
# ordering of building-sector rows in the hidro column is pinned by the CNSF
# USO x TIPO DE EVENTO paid-loss evidence (HOTEL is the largest identified
# commercial use, ~9.4bn MXN; see results/equity_mark_scales/
# cnsf_uso_peril_shares.csv); levels are literature tiers: [CEPAL2014DaLA]
# sector decomposition, [ECB2021EconomyWide] vulnerable sectors,
# [Bressan2024] Mexico TC asset risk, [Kruttli2025] exposure->return.
# Upsides deliberately ignored (adverse-marks channel only): reconstruction
# demand for cemento [Kruttli2025 positive disaster sensitivities], AGUA
# (Rotoplas) drought-adaptation demand.
susceptibility:                # ciclon, lluvia, inundacion, sequia, incendio_forestal, otros
  hoteles:         {ciclon_tropical: 1.0, lluvia: 0.4, inundacion: 0.4, sequia: 0.1, incendio_forestal: 0.05, otros: 0.2}   # coastal tourism: direct TC asset+business interruption [Bressan2024][CNSF USO=HOTEL]
  fibra_hotelera:  {ciclon_tropical: 1.0, lluvia: 0.4, inundacion: 0.4, sequia: 0.1, incendio_forestal: 0.05, otros: 0.2}   # same physical assets as hoteles
  aeropuertos:     {ciclon_tropical: 1.0, lluvia: 0.3, inundacion: 0.3, sequia: 0.0, incendio_forestal: 0.0,  otros: 0.1}   # fixed coastal infra; Otis/Odile closures (INT-21 anchors)
  aerolineas:      {ciclon_tropical: 0.7, lluvia: 0.3, inundacion: 0.2, sequia: 0.0, incendio_forestal: 0.0,  otros: 0.1}   # route disruption; fleet is mobile -> below fixed infra [eng]
  agua:            {ciclon_tropical: 0.3, lluvia: 0.2, inundacion: 0.3, sequia: 0.3, incendio_forestal: 0.0,  otros: 0.1}   # manufacturer's plant/logistics risk; drought DEMAND upside not modeled [eng]
  agroalimentos:   {ciclon_tropical: 0.5, lluvia: 0.5, inundacion: 0.7, sequia: 1.0, incendio_forestal: 0.2,  otros: 0.5}   # crops/inputs: drought-led [ECB2021EconomyWide][CNSF agro line]; freezes in otros
  bebidas:         {ciclon_tropical: 0.3, lluvia: 0.2, inundacion: 0.3, sequia: 0.7, incendio_forestal: 0.0,  otros: 0.1}   # water stress on production [ECB2021EconomyWide]
  seguros:         {ciclon_tropical: 0.6, lluvia: 0.5, inundacion: 0.7, sequia: 0.0, incendio_forestal: 0.05, otros: 0.5}   # Qualitas auto claims: flood/hail-led (otros pools granizo) [CNSF autos]
  reaseguro:       {ciclon_tropical: 1.0, lluvia: 0.5, inundacion: 0.7, sequia: 0.2, incendio_forestal: 0.2,  otros: 0.3}   # cat underwriting: TC-led tail [CNSF hidro TIPO DE EVENTO mix]
  fibra:           {ciclon_tropical: 0.5, lluvia: 0.4, inundacion: 0.5, sequia: 0.05, incendio_forestal: 0.05, otros: 0.2}  # diversified fixed assets [eng]
  cemento:         {ciclon_tropical: 0.2, lluvia: 0.2, inundacion: 0.3, sequia: 0.5, incendio_forestal: 0.05, otros: 0.1}   # water-intensive process; reconstruction upside ignored [Kruttli2025]
  mineria:         {ciclon_tropical: 0.3, lluvia: 0.4, inundacion: 0.4, sequia: 0.6, incendio_forestal: 0.1,  otros: 0.2}   # water use, pit/tailings flooding [ECB2021EconomyWide]
  energia:         {ciclon_tropical: 0.1, lluvia: 0.1, inundacion: 0.1, sequia: 0.1, incendio_forestal: 0.0,  otros: 0.1}   # VISTA producing assets are in Vaca Muerta (Argentina) -> minimal Mexican physical exposure [eng]
  comercio:        {ciclon_tropical: 0.4, lluvia: 0.3, inundacion: 0.5, sequia: 0.1, incendio_forestal: 0.05, otros: 0.15}  # store/DC network + logistics [CNSF USO=TIENDA]
  restaurantes:    {ciclon_tropical: 0.3, lluvia: 0.2, inundacion: 0.3, sequia: 0.1, incendio_forestal: 0.0,  otros: 0.1}   # leisure demand + urban premises [eng]

