  - {naid: 111, issuer: ROTOPLAS,                equity_rf: AGUA_SHARE,      vm: false,
     bonds: [[0.0960, "2029-06-15", 170]]}
  - {naid: 112, issuer: GRUMA,                   equity_rf: GRUMA_SHARE,     vm: true,
     bonds: [[0.0880, "2033-08-15", 85]]}
  - {naid: 113, issuer: GRUPO_HERDEZ,            equity_rf: HERDEZ_SHARE,    vm: false,
     bonds: [[0.0940, "2030-05-15", 140]]}
  - {naid: 114, issuer: BACHOCO,                 equity_rf: BACHOCO_SHARE,   vm: false}
  - {naid: 115, issuer: CULTIBA,                 equity_rf: CULTIBA_SHARE,   vm: false}
  - {naid: 116, issuer: QUALITAS,                equity_rf: QUALITAS_SHARE,  vm: true}
  - {naid: 117, issuer: PENA_VERDE,              equity_rf: PENAVERDE_SHARE, vm: false}
  - {naid: 118, issuer: FIBRA_UNO,               equity_rf: FUNO_SHARE,      vm: true,
