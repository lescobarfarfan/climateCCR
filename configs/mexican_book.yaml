# Mexican counterparty book (OQ-INT-04 / OQ-MKT-12c — the fixture-book swap).
#
# One config, two consumers:
#   1. pipelines/09_build_mexican_book.py reads the universe + trade rules below
#      and deterministically writes the book data-root (data/ccr_book_mx/) in the
#      PIMPA fixture schemas (DC-CCR-RISK-2 layout).
#   2. pipelines/01_climate_jump_demo.py --book-config configs/mexican_book.yaml
#      --data-root data/ccr_book_mx consumes the same file as the book-layout
#      config (build_global_parameters reads data_subdirs/file_names/... verbatim).
#
# Universe: BMV equities weighted toward climate-vulnerable sectors (coastal
# tourism, airports on hurricane paths, water, agro-food, insurance) plus IPC
# liquidity diversifiers; researched + Yahoo-verified 2026-07-25. Debt desk:
# fixed-coupon cebures priced by FixedCouponBondPricer (additive engine
# extension) off the stripped MXN curve + a static issuance spread.
#
# [eng] The bond rows carry REPRESENTATIVE issuance terms by credit tier
# (coupon/maturity/spread plausible for each issuer's cebures program), pending
# prospectus-verified terms from BMV/BIVA (logged as an open question at the
# session digest). Everything else is estimated from data: per-name GBM fits
# (Yahoo, crisis-excluded per MKT-CALIB-03), HW1F + curve from
# results/market_calibration/direct_input/ (MKT-CALIB-05, MKT-CURVE-05),
# MXN_USD_FX_RATE GBM from Banxico FIX (DC-XWALK-5), correlations from the
# joint return panel.

# --- typed Config fields (infra.Config) ---
seed: 233423                 # matches the PIMPA golden baseline discipline
n_paths: 10000
settlement_currency: MXN
date_format: "%Y-%m-%d"

# --- book build parameters (consumed by pipelines/09 only) ---

valuation_date: "2026-07-17"   # the MKT calibration anchor (curve + IPC S0 date)
book_root: data/ccr_book_mx    # output data-root, relative to the repo root

fetch:
  start: "2001-01-01"          # Yahoo history window start (max available)
  cache_subdir: data/market_mx/yahoo/book   # raw pulls + _procedencia.json (GEN-02/05)

# Thin-ticker minimum-data rule (user decision 2026-07-25): names failing it are
# dropped from the book (equity RF + option trades; the NAID keeps IRS/bond
# trades) and logged in the build report + manifest.
min_data:
  min_years: 3.0               # >= 3y of usable history before the valuation date
  max_gap_frac: 0.10           # <= 10% missing vs the panel's trading calendar

# Crisis windows excluded from GBM fits — same values as
# configs/market_calibration.yaml (MKT-CALIB-03).
crisis_windows:
  gfc: ["2008-09-01", "2009-06-30"]
  peso_shock: ["2016-11-01", "2017-03-31"]
  covid: ["2020-03-01", "2021-06-30"]

# Inputs produced by earlier pipelines (05/07); paths relative to the repo root.
inputs:
  hw1f_direct_input: results/market_calibration/direct_input/RFE_HW1F_Calibration_MX.csv
  sie_fix: data/market_mx/sie/fix.csv        # Banxico FIX (MXN per USD) -> MXN_USD_FX_RATE GBM
  sie_tiies: data/market_mx/sie/tiies.csv    # F-TIIE O/N -> curve-factor correlation + fixings
  scale_csv: results/loss_to_rate_scale_2000_2024/scale.csv  # INT-18/19 adopted beta

# S_rate_eff recompute (OQ-MKT-12c): re-invert the adopted literature beta
# through the engine HW1F loading with the MEXICAN alpha (read from
# hw1f_direct_input), writing results/loss_to_rate_scale_mx/scale.csv.
rate_scale_output_dir: results/loss_to_rate_scale_mx

# --- equity universe (28 names; tickers verbatim, INT-07) ---
# sector/climate tags are documentation + digest fodder; the builder only needs
# ticker + rf. vm: whether the issuer's NAID gets the VM_1 collateral agreement.
equities:
  - {ticker: HCITY.MX,    rf: HCITY_SHARE,     issuer: HOTELES_CITY_EXPRESS,  sector: hoteles,        climate: coastal_tourism}
  - {ticker: HOTEL.MX,    rf: HOTEL_SHARE,     issuer: GRUPO_HOTELERO_SANTA_FE, sector: hoteles,      climate: coastal_tourism}
  - {ticker: FIHO12.MX,   rf: FIHO12_SHARE,    issuer: FIBRAHOTEL,            sector: fibra_hotelera, climate: coastal_tourism}
  - {ticker: RLHA.MX,     rf: RLH_SHARE,       issuer: RLH_PROPERTIES,        sector: hoteles,        climate: coastal_tourism}
  - {ticker: POSADASA.MX, rf: POSADAS_SHARE,   issuer: GRUPO_POSADAS,         sector: hoteles,        climate: coastal_tourism}
  - {ticker: FINN13.MX,   rf: FINN13_SHARE,    issuer: FIBRA_INN,             sector: fibra_hotelera, climate: coastal_tourism}
  - {ticker: ASURB.MX,    rf: ASUR_SHARE,      issuer: ASUR,                  sector: aeropuertos,    climate: hurricane_cancun}
  - {ticker: GAPB.MX,     rf: GAP_SHARE,       issuer: GAP,                   sector: aeropuertos,    climate: hurricane_los_cabos}
  - {ticker: OMAB.MX,     rf: OMA_SHARE,       issuer: OMA,                   sector: aeropuertos,    climate: hurricane_acapulco_otis}
  - {ticker: VOLARA.MX,   rf: VOLAR_SHARE,     issuer: VOLARIS,               sector: aerolineas,     climate: weather_disruption}
  - {ticker: AGUA.MX,     rf: AGUA_SHARE,      issuer: ROTOPLAS,              sector: agua,           climate: drought_adaptation}
  - {ticker: GRUMAB.MX,   rf: GRUMA_SHARE,     issuer: GRUMA,                 sector: agroalimentos,  climate: drought_inputs}
  - {ticker: HERDEZ.MX,   rf: HERDEZ_SHARE,    issuer: GRUPO_HERDEZ,          sector: agroalimentos,  climate: drought_inputs}
  # BACHOCO (agro) and TERRA13 (Terrafina, fibra industrial) verified unfetchable on
  # Yahoo 2026-07-25 (404): Bachoco's BMV line went dark after the 2022-23 tender;
  # Terrafina was absorbed by FUNO in 2024. Their NAIDs (114, 119) keep IRS/bond trades.
  - {ticker: CULTIBAB.MX, rf: CULTIBA_SHARE,   issuer: CULTIBA,               sector: bebidas,        climate: water_stress}
  - {ticker: Q.MX,        rf: QUALITAS_SHARE,  issuer: QUALITAS,              sector: seguros,        climate: hail_flood_claims}
  - {ticker: PV.MX,       rf: PENAVERDE_SHARE, issuer: PENA_VERDE,            sector: reaseguro,      climate: cat_reinsurance}
  - {ticker: FUNO11.MX,   rf: FUNO_SHARE,      issuer: FIBRA_UNO,             sector: fibra,          climate: fixed_assets}
  - {ticker: CEMEXCPO.MX, rf: CEMEX_SHARE,     issuer: CEMEX,                 sector: cemento,        climate: water_intensive}
  - {ticker: GCC.MX,      rf: GCC_SHARE,       issuer: GCC,                   sector: cemento,        climate: water_intensive}
  - {ticker: GMEXICOB.MX, rf: GMEXICO_SHARE,   issuer: GRUPO_MEXICO,          sector: mineria,        climate: water_intensive}
  - {ticker: PE&OLES.MX,  rf: PENOLES_SHARE,   issuer: PENOLES,               sector: mineria,        climate: water_intensive}
  - {ticker: VISTAA.MX,   rf: VISTA_SHARE,     issuer: VISTA_ENERGY,          sector: energia,        climate: transition_exposure}
  - {ticker: AC.MX,       rf: AC_SHARE,        issuer: ARCA_CONTINENTAL,      sector: bebidas,        climate: water_stress}
  - {ticker: FEMSAUBD.MX, rf: FEMSA_SHARE,     issuer: FEMSA,                 sector: bebidas,        climate: water_stress}
  - {ticker: WALMEX.MX,   rf: WALMEX_SHARE,    issuer: WALMEX,                sector: comercio,       climate: logistics}
  - {ticker: ALSEA.MX,    rf: ALSEA_SHARE,     issuer: ALSEA,                 sector: restaurantes,   climate: leisure_demand}

fx:
  rf: MXN_USD_FX_RATE          # required by the engine's settlement conversion
  source: sie_fix              # FIX is MXN per USD — the engine's CCY_USD convention

curve:
  rf: MXN_ZERO_YIELD_CURVE

# --- deterministic trade-generation rules (builder) ---
trade_rules:
  options:                     # per surviving listed issuer, on its own share
    target_position_mxn: 50000 # notional (contract multiplier) = target / S0
    legs:
      - {type: call, long_short: long,  moneyness: 1.00, tenor_years: 2}
      - {type: put,  long_short: short, moneyness: 0.95, tenor_years: 2}
  irs:                         # one spot-starting quarterly TIIE swap per issuer
    notional_mxn: 100000
    settlement_lag_days: 2     # first payment = first fixing + 3M + lag (fixture pattern)
    fixed_rate_by_tenor: {5: 0.0875, 7: 0.0900, 10: 0.0940}  # near-par vs the 2026-07-17 curve [eng]
    tenor_cycle: [5, 7, 10]    # assigned round-robin in NAID order
    direction_cycle: [receiver, payer]  # alternated in NAID order -> two-way book; labels are
                               # market semantics since OQ-CCR-10 (payer = pays fixed) -- the
                               # cycle swap keeps every NAID's economic direction unchanged
  bonds:
    default_face: 100000       # notional column of BONDS.csv (per 100 face pricing)

# --- counterparties: one NAID per issuer (+ 2 debt-only), NAID order = book order ---
# bonds: two row forms (OQ-INT-10 a, swap of 2026-08-08):
# - legacy triple [cupon, vencimiento, spread_bp] — representative terms [eng];
# - dict {tipo: fija|frn, cupon|sobretasa, vencimiento, spread_bp, fuente} —
#   verified issuance terms with the provenance URL. frn = 28-day TIIE-linked
#   (TIIE de Fondeo for 2025+ issues, TIIE 28 legacy); the sobretasa is the
#   contractual margin, and the discount margin (spread_bp) defaults to it.
#   For verified fija rows the coupon+maturity are sourced; spread_bp is the
#   MBono issuance spread where the source quotes one, else carried from the
#   old representative row [eng]. Day-of-month on month-grain sources = the
#   issue-date anniversary [eng]. UDI-linked series (CFE 252UX, PEMEX 26-U)
#   are excluded — outside the nominal single-curve pricer (CCR-RISK-04).
#   Primary-PDF route: BMV docs-pub bot-blocks; issuer-IR-hosted PDFs work
#   (the OMA 26 suplemento below is the prospectus-verified exemplar).
# Issuers without a bonds list have no debt desk entry.
