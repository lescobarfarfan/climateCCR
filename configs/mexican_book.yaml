# VM_1 contractual terms for vm: true NAIDs (fixture NAID-23 values, USD units) [eng].
vm_terms: {WE_POST_P: "YES", WE_RECEIVE_R: "YES", T_P: 2, T_R: 1.5, MTA_P: 0.5, MTA_R: 0.3}

# IV-surface proxy grid: flat at each name's fitted GBM sigma (no free MXN
# single-name surfaces exist — realized-vol proxy [eng]); fixture grid shape.
iv_surface:
