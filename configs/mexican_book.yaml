              fuente: "https://ir.oma.aero/wp-content/uploads/2026/07/4.-Suplemento-Primera-Emision-OMA26.pdf"}]}
     # OMA 26: TIIE de Fondeo + 0.39%, emision 2026-07-20, MXN 420mn — the
     # prospectus-verified exemplar (suplemento definitivo, primary source).
