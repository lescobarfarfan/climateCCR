     bonds: [[0.0980, "2031-06-15", 240]]}
  - {naid: 104, issuer: RLH_PROPERTIES,          equity_rf: RLH_SHARE,       vm: false}
  - {naid: 105, issuer: GRUPO_POSADAS,           equity_rf: POSADAS_SHARE,   vm: false,
     bonds: [[0.1050, "2030-06-30", 320]]}
  - {naid: 106, issuer: FIBRA_INN,               equity_rf: FINN13_SHARE,    vm: false}
  - {naid: 107, issuer: ASUR,                    equity_rf: ASUR_SHARE,      vm: true,
     bonds: [[0.0890, "2032-03-15", 90]]}
  - {naid: 108, issuer: GAP,                     equity_rf: GAP_SHARE,       vm: true,
     bonds: [[0.0910, "2031-02-15", 100]]}
  - {naid: 109, issuer: OMA,                     equity_rf: OMA_SHARE,       vm: true,
