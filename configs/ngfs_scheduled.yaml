# NGFS ST paths -> scheduled_shocks fragments (the fase producer, OQ-INT-12 a).
#
# pipelines/22 reads the tidy NGFS data and the shared shock config below
# (single source for scenarios / region / window / curve_name /
# equity_leg.sectors — do NOT duplicate the crosswalk here) and emits one YAML
# fragment per scenario under `out_root`, consumed by
# pipelines/01 --choques-programados (the INT-33 scheduled_shocks block).
#
# Raw published deltas (user ruling 2026-08-27): each path's t=0 point carries
# the scenario delta already accumulated at the valuation date; the engine
# pins t=0 to the observed market and applies that value from the first
# simulation step (the catch-up), then tracks the published path. The
# sovereign long anchor is deliberately absent (INT-33 single-factor note);
# the credit-spread leg (Phase 2, OQ-INT-12 b) rides the fragment as a
# valuation-side `spread_shocks` channel (bond_leg.sectors, excl-policy
# corporate_bond_spread_adjustment) that the bond pricers read per date.
#
#   python pipelines/22_ngfs_scheduled_shocks.py [--forzar]
#   python pipelines/17_ngfs_epe_readout.py --config configs/ngfs_scheduled.yaml

valuation_date: "2026-07-17" # MKT-CURVE-05 anchor; pipelines/01 cross-checks its run config
shock_config: configs/ngfs_shock.yaml
ngfs_dir: data/scenarios_mx/ngfs_short_term
out_root: results/ngfs_scheduled_shocks

# --- pipelines/17_ngfs_epe_readout.py: the fase matrix (OQ-INT-12 c) ---
# Like-for-like against the same unshocked base run as the nivel/trayectoria
# readouts: every fase cell is the unshocked book + --choques-programados with
# the fragment above, run under `--etiqueta ngfs_<scen>_fase_sin_spread`
# (rate + equity channels only — the Phase-2 spread channel joins later).
# flavor: fase turns on the 0D pin assertion — fase 0D rows are zero-delta by
# construction (INT-33), so a 0D delta is a bug signal, not a result; compare
# per-pillar tables from the first post-0D pillar (book_profile_deltas.csv).
readout:
  flavor: fase
  out_dir: results/ngfs_epe_readout_fase_sin_spread
  base_run: climate_jump_real_mexican
  scenario_runs:
    - {scenario: HWTP, band: headline, run: climate_jump_real_mexican_ngfs_hwtp_fase_sin_spread}
    - {scenario: HWTP, band: floor, run: climate_jump_real_mexican_floor_ngfs_hwtp_fase_sin_spread}
    - {scenario: HWTP, band: ct_anchor, run: climate_jump_real_mexican_ct_anchor_ngfs_hwtp_fase_sin_spread}
    - {scenario: SWUC, band: headline, run: climate_jump_real_mexican_ngfs_swuc_fase_sin_spread}
    - {scenario: SWUC, band: floor, run: climate_jump_real_mexican_floor_ngfs_swuc_fase_sin_spread}
    - {scenario: SWUC, band: ct_anchor, run: climate_jump_real_mexican_ct_anchor_ngfs_swuc_fase_sin_spread}
    - {scenario: DAPS_NAM, band: headline, run: climate_jump_real_mexican_ngfs_daps_nam_fase_sin_spread}
